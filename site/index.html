<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backlink Scout</title>
  <meta name="description" content="Discover outreach opportunities for independent creators.">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <section class="hero">
      <svg class="shade" viewBox="0 0 100 98.75" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <path fill="#f9f3ed" fill-rule="evenodd" d="M98.94,14.01C70.45-5.03,27.01-4.31,1.09,14.01c-6.26,33.02,15.08,74.96,48.92,84.74,33.2-7.97,55.18-54.61,48.92-84.74h0Z"/>
      </svg>

      <header class="logo">
        <img src="/backlink-scout-logo.svg" alt="Backlink Scout" width="160" height="59">
      </header>

      <div class="hero-content">
        <h1>Find backlinks<br>suited for you, fast</h1>
        <form onsubmit="event.preventDefault()">
          <input type="url" placeholder="https://example.com" aria-label="Project URL">
          <button type="submit">Analyze project</button>
        </form>
      </div>
    </section>

    <img class="scene" src="/backlink-scout-image.webp" alt="Scout searching for backlink opportunities" width="3200" height="2000">
  </main>
</body>
</html>
